  notes: Three thousand nine hundred thirty-four water Certificate of Convenience
    and Necessity polygons from the commission's published shapefile. UTILITY names
    the certificate holder on every polygon and CCN_NO has 1,873 distinct numbers,
    so one holder can have many polygons; 399 polygons name Aqua Texas. STATUS is
    Commission Approved on 3856 and a pending final-order docket on 78; a pending
    docket is not a final certificate and is held for review. CCN_TYPE is a bounded
    service area on every polygon, spelled three ways. DBA_NAME is the text NA on
    3,839. The archive also holds 423 facility lines (PUCT_CCNFAC_WATER_TSMS), which
    are not declared. A certificate is the area a utility is authorized and obligated
    to serve, not proof that pipes are in the ground.     The shapefile has no feature
    id, so the row position identifies a polygon within this snapshot. That position
    will not survive a new download, so a match override must not use it. Vintage is
    the file's Last-Modified date at download. The commission posts updates about
    monthly. Licence terms require review before redistribution.
  redistribution: internal_only
