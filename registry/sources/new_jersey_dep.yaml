- source_id: new_jersey_power_plants_dep
  publisher: New Jersey Department of Environmental Protection
  driver: arcgis
  url: https://mapsdep.nj.gov/arcgis/rest/services/Features/Utilities/MapServer/20
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
