  - gis/new_jersey_power_plants_dep
  layers:
  - layer: '20'
    sector: electric
    grain: facility
    metadata_path: gis/new_jersey_power_plants_dep/layer_metadata.json
    name_field: PLANT_NAME
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      utility_name: UTILITY_NAME
      primary_source: PRIMSOURCE
      grid_supply: GRIDSUPPLY
    state_fixed: NJ
  notes: Seventy-seven named plants above the layer's stated 1 megawatt threshold.
    PRIMSOURCE is Natural Gas on 47, Biomass on 16, Petroleum on 5, and two each
    for Nuclear, Coal, Hydroelectric, and Wind, plus Pumped Storage on 1.
    GRIDSUPPLY is Y on 60 and N on 17. STATENAME is New Jersey on every feature.
    These are plants, not service areas. Cadence is a collection assumption and
    licence terms require review before redistribution.
  redistribution: internal_only
