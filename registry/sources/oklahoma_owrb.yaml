  paths:
  - gis/oklahoma_water_service_areas_owrb
  layers:
  - layer: '0'
    sector: water
    grain: service_area
    role: active_retail_service
    metadata_path: gis/oklahoma_water_service_areas_owrb/layer_metadata.json
    name_field: name
    id_fields:
      feature_id: objectid
      pwsid: pwsid
    authority: state_regulator
