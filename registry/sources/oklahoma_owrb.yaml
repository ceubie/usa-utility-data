  publisher: Oklahoma Water Resources Board
  driver: arcgis
  url: https://owrb.csa.ou.edu/server/rest/services/Water_Supply/Water_Systems/MapServer/0
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
