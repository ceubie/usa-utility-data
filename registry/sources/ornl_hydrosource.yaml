  notes: >-
    Not a facility input. 275 relicensing proceedings and 274 FERC dockets.
    Status is Issued Relicense on 128, Pending Relicense on 89, Issued Surrender
    on 33, Pending Surrender on 17, Surrender withdrawn on 6, and Converted to
    Exemption on 2. Every row has project type CH. This is a proceeding list,
    not a plant inventory or a service area. It stays draft and is not read.
  redistribution: internal_only
