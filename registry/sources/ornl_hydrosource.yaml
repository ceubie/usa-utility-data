  - layer: hydropower_facilities.parquet
    sector: electric
    grain: facility
  notes: >-
    Not a facility input. 1,401 rows, 1,017 FERC docket numbers, and 997 project
    names. FID is unique, but 90 rows repeat the same docket, project name, and
    coordinates. Method is N/A on 742, NLP Assisted on 624, and Manual on 35.
    The table is a mitigation extract of FERC projects, not one row per plant,
    and the licensed projects are already represented by the FERC hydropower
    sources. It stays draft and is not read.
  redistribution: internal_only
