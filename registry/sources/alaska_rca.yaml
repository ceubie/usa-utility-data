- source_id: alaska_sewer_areas_rca
  publisher: Regulatory Commission of Alaska
  driver: arcgis
  url: https://maps.commerce.alaska.gov/server/rest/services/Services/CDO_Utilities/MapServer/92
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/alaska_sewer_areas_rca
  layers:
  - layer: '92'
    sector: wastewater
    grain: service_area
    metadata_path: gis/alaska_sewer_areas_rca/layer_metadata.json
    name_field: UtilityName
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: OBJECTID
      state_id: CertificateNumber
    authority: state_regulator
    vintage_field: AsOfDate
    state_fixed: AK
    role_field:
      field: UtilityType
      values:
        Sewer: certified_franchise_territory
        Sewer - PC: review_required
      on_null: reject
  notes: UtilityType is Sewer on 71 features and Sewer - PC on 62. The layer does
    not define PC, so those certificates stay in review and are not retail. AsOfDate
    is a layer as-of timestamp. Cadence is a collection assumption and licence terms
    require review before redistribution.
  redistribution: internal_only
