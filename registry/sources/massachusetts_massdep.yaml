- source_id: massachusetts_water_unlocated_massdep
  publisher: Massachusetts Department of Environmental Protection
  driver: arcgis
  url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/DEP_PWS_WATER_SERVICE_AREAS/FeatureServer/3
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/massachusetts_water_unlocated_massdep
  layers:
  - layer: '3'
    sector: water
    grain: registry_table
    metadata_path: gis/massachusetts_water_unlocated_massdep/layer_metadata.json
    name_field: PWS_NAME
    id_fields:
      feature_id: OBJECTID
      pwsid: PWS_ID
    attribute_fields:
      town: PWS_TOWN
      pws_class: PWS_CLASS
      address: ADDRESS
    state_fixed: MA
    pwsid_rule: state_prefix_7
    on_invalid_pwsid: preserve_raw_without_federal_id
  notes: Nonspatial table of 13 unlocated systems; does not establish any serving
    polygon. The PWS_ID values are seven-digit state numbers and were checked against
    SDWIS. Cadence is a collection assumption and licence terms require review before
    redistribution.
  redistribution: internal_only
