sources:
- source_id: massachusetts_water_community_massdep
  publisher: Massachusetts Department of Environmental Protection
  driver: arcgis
  url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/DEP_PWS_WATER_SERVICE_AREAS/FeatureServer/2
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  redistribution: internal_only
  reviewed: false
  paths:
  - gis/massachusetts_water_community_massdep
  layers:
  - layer: '2'
    sector: water
    grain: service_area
    metadata_path: gis/massachusetts_water_community_massdep/layer_metadata.json
    name_field: PWS_NAME
    id_fields:
      feature_id: OBJECTID
      pwsid: PWS_ID_C
    authority: state_regulator
    vintage_field: SERVCEYEAR
    status_field:
      field: PWS_STATUS
      values:
        A: active
        I: inactive
      on_null: unknown
    state_fixed: MA
    pwsid_rule: state_prefix_7
    boundary_representation: mixed
    on_missing_name: preserve_and_review
    on_invalid_pwsid: preserve_raw_without_federal_id
  notes: 'Licence review on 2026-11-12 found the re-fetched text is not a redistribution grant. Cadence is a conservative collection assumption; licence terms require verification
    before redistribution. Mapped and estimated boundaries are mixed; state authority
    alone does not identify modeled geometries. Includes estimates and location placeholders;
    exclude mixed-representation areas from non-modeled metrics until a per-feature
    distinction is validated. Held for best-area eligibility review: some small-circle
    placeholders do not represent actual service, and SERVCECONF alone does not identify
    them.'
