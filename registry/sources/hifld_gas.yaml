  layers:
  - layer: '0'
    sector: natural_gas
    grain: service_area
    role: active_retail_service
    metadata_path: gis/natural_gas_ldc_territories_hifld/layer_metadata.json
    authority: federal_modeled
    boundary_representation: modeled
    name_field: NAME
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      territory_id: SVCTERID
      utility_type: TYPE
      company_id: COMPID
