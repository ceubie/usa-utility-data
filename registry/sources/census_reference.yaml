- source_id: census_baf2020
  publisher: U.S. Census Bureau
  driver: http
  url: https://www2.census.gov/geo/docs/maps-data/data/baf2020/BlockAssign_ST{statefp}_{usps}.zip
  cadence: frozen
  licence: public_domain
  redistribution: shareable
  reviewed: false
  storage: home
  paths:
  - reference/census/baf2020
  layers:
  - layer: INCPLACE_CDP
    sector: reference
    grain: registry_table
    attribute_fields:
      block_geoid: BLOCKID
      placefp: PLACEFP
  - layer: COUSUB
    sector: reference
    grain: registry_table
    attribute_fields:
      block_geoid: BLOCKID
      countyfp: COUNTYFP
      cousubfp: COUSUBFP
  - layer: MCD
    sector: reference
    grain: registry_table
    attribute_fields:
      block_geoid: BLOCKID
      countyfp: COUNTYFP
      cousubfp: COUSUBFP
  - layer: AIANNH
    sector: reference
    grain: registry_table
    attribute_fields:
      block_geoid: BLOCKID
      aiannhce: AIANNHCE
  notes: Census 2020 Block Assignment Files, 52 zips. The published directory has
    no file for American Samoa, Guam, the Northern Mariana Islands, or the Virgin
    Islands. Incorporated place is INCPLACE_CDP. County subdivision is COUSUB or
    MCD when that member is in the zip; a zip does not always contain either.
    Tribal area is AIANNH when present. Not one of the 223 utility drafts.
- source_id: census_ct_county_crosswalk
  publisher: U.S. Census Bureau
  driver: http
  url: https://www2.census.gov/geo/docs/reference/ct_change/ct_cou_to_cousub_crosswalk.txt
  cadence: frozen
  licence: public_domain
  redistribution: shareable
  reviewed: false
  storage: home
  paths:
  - reference/census/ct/ct_cou_to_cousub_crosswalk.txt
  layers:
  - layer: ct_county_crosswalk
    sector: reference
    grain: registry_table
    attribute_fields:
      state: STATEFP
      old_countyfp: OLD_COUNTYFP
      old_county_name: OLD_COUNTY_NAMELSAD
      new_countyfp: NEW_COUNTYFP
      new_county_name: NEW_COUNTY_NAMELSAD
      cousubfp: COUSUBFP
      old_cousub_geoid: OLD_COUSUB_GEOID
      new_cousub_geoid: NEW_COUSUB_GEOID
  notes: Connecticut county-to-planning-region crosswalk. The header cells contain
    line breaks, and a glossary follows the data rows. Used only when block
    COUNTYFP20 values are the eight old counties. Subdivision 00000 in old
    Fairfield County is listed under two planning regions; those zero-population
    water blocks are assigned to the 2025 county that contains the block internal
    point. Not one of the 223 utility drafts.
- source_id: census_government_units_2025
  publisher: U.S. Census Bureau
  driver: http
