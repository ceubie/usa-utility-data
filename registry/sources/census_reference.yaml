      census_id: CENSUS_ID_PID6
      name: UNIT_NAME
      unit_type: UNIT_TYPE
      state: STATE
      state_fips: FIPS_STATE
      county_fips: FIPS_COUNTY
  notes: 2025 Government Units Listing workbook linked from
    https://www.census.gov/data/datasets/2025/econ/gus/public-use-files.html.
    The zip contains Govt_Units_2025_Final.xlsx and a documentation PDF. Every
    workbook sheet is kept. Not one of the 223 utility drafts.
