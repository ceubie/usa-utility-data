  - reference/census/tiger2025/tabblock20
  layers:
  - layer: tabblock20
    sector: reference
    grain: registry_table
    attribute_fields:
      block_geoid: GEOID20
      state: STATEFP20
      countyfp: COUNTYFP20
      tractce: TRACTCE20
      pop20: POP20
      housing20: HOUSING20
      aland20: ALAND20
      lat: INTPTLAT20
      lon: INTPTLON20
  notes: Census 2020 tabulation blocks from TIGER/Line 2025, one zip for each of
    the 56 states, the District of Columbia, Puerto Rico, and island areas. Not
    one of the 223 utility drafts. Column checks run in the reference build.
