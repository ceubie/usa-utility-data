sources:
- source_id: hawaii_maui_sewer_discharge_points
  publisher: County of Maui Wastewater Reclamation Division
  driver: arcgis
  url: https://services3.arcgis.com/fsrDo0QMPlK9CkZD/arcgis/rest/services/Sewer_System_Full/FeatureServer/1
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/hawaii_maui_sewer_discharge_points
  layers:
  - layer: '1'
    sector: wastewater
    grain: facility
    metadata_path: gis/hawaii_maui_sewer_discharge_points/layer_metadata.json
    name_field: PermitName
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      discharge_type: DISCHRGTYP
      basin: Basin
    state_fixed: HI
  notes: Twenty-four injection wells. PermitName is present on every feature and
    OWNEDBY is empty on every feature, so no owner is assigned. Basin is Kahului on
    8, Lahaina on 4, Maalaea Harbor on 4, Kihei on 3, Kaunakakai on 3, and Maalaea
    Triangle on 2. These are discharge points, not service areas. Cadence is a
    collection assumption and licence terms require review before redistribution.
  redistribution: internal_only
- source_id: hawaii_maui_sewer_pump_stations
  publisher: County of Maui Wastewater Reclamation Division
  driver: arcgis
  url: https://services3.arcgis.com/fsrDo0QMPlK9CkZD/arcgis/rest/services/Sewer_System_Full/FeatureServer/2
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/hawaii_maui_sewer_pump_stations
  layers:
  - layer: '2'
    sector: wastewater
    grain: facility
    metadata_path: gis/hawaii_maui_sewer_pump_stations/layer_metadata.json
    name_field: NAME
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      owner_code: OWNEDBY
    state_fixed: HI
  notes: Eighty-seven named pump stations. OWNEDBY uses the AssetOwner code. 1 is
    Our Agency on 42 features, -1 is Private on 44, and -2 is Other on 1. These are
    pump stations, not service areas. Cadence is a collection assumption and licence
    terms require review before redistribution.
  redistribution: internal_only
