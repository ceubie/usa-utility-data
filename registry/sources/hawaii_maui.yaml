  layers:
  - layer: '3'
    sector: wastewater
    grain: network
    metadata_path: gis/hawaii_maui_sewer_pressurized_mains/layer_metadata.json
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      ownership: OwnershipInfo
    state_fixed: HI
  notes: One hundred thirty-one pressurized sewer mains. OwnershipInfo is County on
    78, Private on 47, County Aband on 4, Castle and Cook Resorts on 1, and DHHL on
