    sector: electric
    grain: facility
    metadata_path: gis/michigan_nuclear_power_plants_mpsc/layer_metadata.json
    name_field: Plant_Name
    id_fields:
      feature_id: OBJECTID_1
    attribute_fields:
      utility_name: Utility_Na
      operation: Operation
    state_fixed: MI
  notes: Four plant locations. Operation is Operational for Fermi and Donald C Cook,
    Shut Down for Palisades, and Decommissioned for Big Rock Point. Palisades
    Retirement_Year_T says it retired in 2022 and returned to operational status in
    2025, which disagrees with Operation, so this is a facility inventory and not
    evidence that every unit is operating. Cadence is a collection assumption and
    licence terms require review before redistribution.
  redistribution: internal_only
