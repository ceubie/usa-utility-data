- source_id: michigan_wind_turbines_mpsc
  publisher: Michigan Public Service Commission
  driver: arcgis
  url: https://services3.arcgis.com/943LBv9FP414WfDO/arcgis/rest/services/MI_Wind_Turbines/FeatureServer/1
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/michigan_wind_turbines_mpsc
  layers:
  - layer: '1'
    sector: electric
    grain: facility
    facility_level: unit
    facility_type_fixed: wind_turbine
    metadata_path: gis/michigan_wind_turbines_mpsc/layer_metadata.json
    name_field: p_name
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      manufacturer: t_manu
      county: t_county
      plant_capacity_mw: p_cap
      unit_capacity_kw: t_cap
      turbine_count: p_tnum
    state_fixed: MI
  notes: One thousand seven hundred ten turbines in 38 named projects. There is no
    operating-status field, so the layer is an inventory rather than proof that
    every turbine is operating. p_cap is cumulative project capacity in megawatts
    and is repeated on every turbine. t_cap is the turbine rated capacity in
    kilowatts. p_tnum is the project turbine count and is not a capacity multiplier.
    These are turbines, not service areas. The national wind-turbine database also
    has Michigan rows. Those rows are rejected with reason state_unit_inventory
    while this inventory is the reviewed wind-turbine list for Michigan, so the two
    files are not added together. Cadence is a collection assumption and licence
    terms require review before redistribution.
  redistribution: internal_only
- source_id: michigan_hydroelectric_dams_mpsc
  publisher: Michigan Public Service Commission
