    name_field: Plant_Name
    id_fields:
      feature_id: OBJECTID_1
    attribute_fields:
      utility_name: Utility_Na
      plant_sector: sector_nam
      primary_source: PrimSource
    state_fixed: MI
  notes: Fifty-nine named electric generating plants. PrimSource is natural gas on
    every feature. sector_nam is Electric Utility on 37, Industrial CHP on 10,
    Commercial CHP on 5, IPP CHP on 4, and IPP Non-CHP on 3. Five features have
    nonzero Crude_MW, one has nonzero Hydro_MW, and one has nonzero Other_MW. These
    are plants, not gas-utility service areas. The saved State text is Michigan on
    every feature. Cadence is a collection assumption and licence terms require
    review before redistribution.
