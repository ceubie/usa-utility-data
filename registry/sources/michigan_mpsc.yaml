    sector: electric
    grain: facility
    metadata_path: gis/michigan_hydroelectric_dams_mpsc/layer_metadata.json
    name_field: Dam_Name
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      owner_name: Owner_Names
      owner_type: Owner_Types
      primary_purpose: Primary_Purpose
      operational_status: Operational_Status
    state_fixed: MI
  notes: One hundred sixteen named dams. Primary_Purpose is Hydroelectric on 113.
    Soo Locks is Navigation, Moores Park Dam is Other, and Barton Dam is Water Supply.
    Owner_Names is blank on 29 features. Owner_Types is Public Utility on 39, Private
    on 29, Not Listed on 29, Local Government on 18, and Federal on 1. Operational_Status
    is Normal Operations on 76, Under Remediation on 19, and Under Investigation,
    Planning, Permitting, or Design for Remediation on 3, with 18 features blank.
    These are dam locations, not retail service areas. The saved State text is
    Michigan on every feature. Cadence is a collection assumption and licence terms
    require review before redistribution.
  redistribution: internal_only
