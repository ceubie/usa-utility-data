  notes: 'Reverted to draft on 2026-11-12 (decision D1). Not on the approved promotion
    list. An earlier gate refused this 2020 map because the company names are superseded:
    Bangor Hydro and Maine Public Service now operate as Versant Power. The declaration
    is retained so it can be opted in. Thirty-four transmission and distribution utility
    polygons naming 12 utilities: Central Maine Power on 18, Bangor Hydro on 4, Maine
    Public Service on 3, and consumer-owned utilities on the rest. OWNER names the
    parent, Avangrid on 18 and Versant Power on 7. OBJECTID repeats the value 0, so
    OBJECTID_1 is the feature id. The layer is a 2020 map last edited in March 2021,
    so cadence is frozen and the vintage is fixed at 2020. Licence terms require
    review before redistribution.'
