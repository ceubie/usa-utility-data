    sector: wastewater
    grain: registry_table
    id_fields:
      cwns_id: CWNS_ID
    attribute_fields:
      facility_name: FACILITY_NAME
      state: STATE_CODE
      infrastructure_type: INFRASTRUCTURE_TYPE
      owner_type: OWNER_TYPE
      review_status: REVIEW_STATUS
