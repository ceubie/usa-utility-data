  notes: "2022 CWNS national CSV extract. The dictionary file CWNS-Database-Dictionary-January2025.xlsx
    was fetched from https://sdwis.epa.gov/ords/sfdw_pub/r/sfdw/cwns_pub/download-state-zip?p2_location_id=DD&session=13584687560178&cs=16CohG879kRukk8FzXPo2CpQ-Ez8rWcdORFsaZepMCPL9Rk6_loMyAvIYmSLJUHd-gEClzliHaIuYCTJmScChcA
    linked from the data-download page. FLOW_TYPE Total Flow is the total row.
    Saved flow types are Municipal Flow, Industrial Flow, Infiltration Flow, Wet
    Weather Peak, and Total Flow. POPULATION_TYPE is Receiving Collection or Total
    Receiving Treatment. TOTAL_RES_POPULATION_2022 is the total current residential
    population, including upstream population when the id is linked in a sewershed.
    REVIEW_STATUS FA is Federal Accepted and UNC is Confirmed. AUTHORITY_NAME on
    the responsible-entity row is the owning agency, not the plant. Licence terms
    were not stated, so redistribution stays internal."
