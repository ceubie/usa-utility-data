  notes: Licence review on 2026-11-12 found the re-fetched text grants Creative Commons Attribution 4.0. Independent gate 2026-11-12 set this source back to draft. NOTES says another
    provider serves part of the polygon on 17 features, and an earlier gate classed
    the 2014 compilation as historical. Forty-six electric service-area polygons naming 39 providers; Springville
    has eight polygons. NOTES flags 10 polygons where part of a municipality is served
    by another provider, six owned by Utah County and served by Springville, and one
    for Spanish Fork. The description gives a last update of September 20, 2021, with
    sources including the Utah Division of Public Utilities and Rocky Mountain Power,
    and says boundaries were derived from counties, parcels, municipalities, and survey
    sections, so representation is unknown. Cadence is a collection assumption and
    licence terms require review before redistribution.
