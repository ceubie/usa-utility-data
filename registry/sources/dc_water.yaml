sources:
- source_id: dc_water_pressure_zones
  publisher: DC Water
  driver: arcgis
  url: https://geo.dcwater.com/arcgis/rest/services/Viewer/DWS16inLargeMain/MapServer/6
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/dc_water_pressure_zones
  layers:
  - layer: '6'
    sector: water
    grain: admin_association
    metadata_path: gis/dc_water_pressure_zones/layer_metadata.json
    name_field: PRESSUREZONE
    id_fields:
      feature_id: OBJECTID
    state_fixed: DC
  notes: Twelve operational pressure zones of one utility, including 1st, 2nd, 3rd,
    4thAlaska, 4thReno, Ana-1st, Ana-2nd, Ana-3rd, and Low. These are not provider
    service territories and not source watersheds. Cadence is a collection assumption
    and licence terms require review before redistribution.
  redistribution: internal_only
- source_id: dc_water_facilities
  publisher: DC Water
  driver: arcgis
  url: https://geo.dcwater.com/arcgis/rest/services/Viewer/DWS16inLargeMain/MapServer/1
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/dc_water_facilities
  layers:
  - layer: '1'
    sector: water
    grain: facility
    metadata_path: gis/dc_water_facilities/layer_metadata.json
    name_field: NAME
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      owner: OWNER
      flow_type: FLOWTYPE
      lifecycle: LIFECYCLESTATS
    state_fixed: DC
  notes: Twenty-nine water facility points. NAME is present on 26 features and blank
    on 3. OWNER is WASA on 13, WAD on 13, Private on 2, and AFRH_W on 1. FLOWTYPE is
    Potable on 25 and Raw on 4. LIFECYCLESTATS is Active on every feature. SUBTYPE
    is the layer type id. Saved features are 1 EnclosedStorageFacility on 5, 3
    PumpStation on 10, 4 StorageBasin on 12, and 5 TreatmentPlant on 2. Metadata
    also defines 2 ProductionWell and 6 ClearWell, with no saved features. These are
    facilities, not service areas. Cadence is a
    collection assumption and licence terms require review before redistribution.
  redistribution: internal_only
