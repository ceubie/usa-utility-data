sources:
- source_id: arizona_water_service_areas_adhs_2022
  publisher: Arizona Department of Health Services
  driver: arcgis
  url: https://services1.arcgis.com/mpVYz37anSdrK4d8/arcgis/rest/services/Public_Water_System_from_Arizona_EPHT_Explorer/FeatureServer/1
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  redistribution: internal_only
  reviewed: false
  paths:
  - gis/arizona_water_service_areas_adhs_2022
  layers:
  - layer: '1'
    sector: water
    grain: service_area
    metadata_path: gis/arizona_water_service_areas_adhs_2022/layer_metadata.json
    name_field: CWS_NAME
    id_fields:
      feature_id: OBJECTID_12
      pwsid: ADEQ_ID
    authority: state_regulator
    status_field:
      field: STATUS
      values:
        A: active
        I: inactive
        ' ': unknown
      on_null: unknown
    state_fixed: AZ
    on_missing_name: preserve_and_review
    on_invalid_pwsid: preserve_raw_without_federal_id
  notes: 'Licence review on 2026-11-12 found the re-fetched text is not a redistribution grant. 917 features, matching the snapshot. CWS_NAME is present on every row.
    STATUS is A on 751, I on 141, and a single space on 25, and those three values
    are mapped, so this is not an unmapped status code. Geometry is null on 37 and
    nonempty on 880. The layer description says a primary system boundary was used
    when the system supplied one and a certificate or census-place boundary otherwise.
    No saved field records which method a polygon used. STATE is a mailing state:
    AZ on 833, a single space on 29, and another state on 55. Left draft because
    primary and secondary footprints are mixed and 37 geometries are missing.
    Cadence is a collection assumption and licence terms require review before
    redistribution.'
