sources:
- source_id: oregon_eugene_waste_lines
  publisher: City of Eugene
  driver: arcgis
  url: https://gis.eugene-or.gov/arcgis/rest/services/PWE/Wastewater/MapServer/4
  cadence: irregular
  licence: unknown
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/oregon_eugene_waste_lines
  layers:
  - layer: '4'
    sector: wastewater
    grain: network
    metadata_path: gis/oregon_eugene_waste_lines/layer_metadata.json
    name_field: OWNER
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      structure_type: STRUCT_TYPE
    state_fixed: OR
  notes: Twenty-three thousand six hundred two wastewater lines. OWNER is EUGENE on
    every feature. STRUCT_TYPE is WLINE on 16319, WWYSER on 4563, WCOLIN on 1592,
    WSTUBL on 818, WTOTAP on 136, WPRESL on 90, WPUMPL on 53, WSIPHL on 29, and
    WSERVC on 2. These are pipes, not service areas. Cadence is a collection
    assumption and licence terms require review before redistribution.
  redistribution: internal_only
