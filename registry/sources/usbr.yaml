- source_id: usbr_hydropower_facilities
  publisher: U.S. Bureau of Reclamation
  driver: arcgis
  url: https://services1.arcgis.com/ixD30sld6F8MQ7V5/arcgis/rest/services/Reclamation_HydropowerFacilities/FeatureServer/0
  cadence: irregular
  licence: internal_or_no_redistribution
  out_of_scope: false
  superseded_by: null
  reviewed: true
  paths:
  - gis/usbr_hydropower_facilities
  layers:
  - layer: '0'
    sector: electric
    grain: facility
    metadata_path: gis/usbr_hydropower_facilities/layer_metadata.json
    name_field: assetname
    id_fields:
      feature_id: OBJECTID
    attribute_fields:
      asset_type: assettype
      operator: operatingentity1
  notes: Licence review on 2026-11-12 found the re-fetched text does not allow redistribution. Eighty-one named hydropower facilities. assettype is Conventional on 72,
    Pumped Storage on 6, and Combination on 3. operatingentity1 has 13 values, so
    the operator is not the Bureau of Reclamation on every feature. These are plants,
    not service areas. Cadence is a collection assumption and licence terms require
    review before redistribution.
  redistribution: internal_only
