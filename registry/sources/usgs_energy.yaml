  layers:
  - layer: usgs_uspvdb_v4_20260414.csv
    sector: electric
    grain: facility
    facility_level: plant
    facility_type_fixed: solar_farm
    name_field: p_name
    id_fields:
      feature_id: case_id
    attribute_fields:
      county: p_county
      plant_capacity_mw: p_cap_ac
      capacity_dc_mw: p_cap_dc
      year_online: p_year
      eia_plant_id: eia_id
      site_type: p_type
      longitude: xlong
      latitude: ylat
    state_field: p_state
  notes: 'United States Large-Scale Solar Photovoltaic Database version 4.0, released
    2026-04-14: 6,611 rows and 6,611 distinct case_id values. xlong runs from -162.5531
    to -67.4623 and ylat from 19.6558 to 66.8385. p_cap_ac is alternating-current
    capacity in megawatts and is the plant capacity; 52 rows are below 1 MW and the
    minimum is 0.2. p_cap_dc is direct-current capacity. p_sys_type is ground on
    5,976, rooftop on 407, canopy on 148, a combination on 78, and floating on 2.
    These are plants, not service areas. Licence terms require review before redistribution.'
  redistribution: internal_only
