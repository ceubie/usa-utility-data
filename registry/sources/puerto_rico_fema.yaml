  notes: Thirty-seven named generation points. Type_ is Hydroelectric on 11, Solar Farm
    on 7, Gas Turbines on 5, Wind Farm on 3, Diesel Generator on 2, Gas Turbines /
    Steam on 2, Landfill Gas on 2, and one each of Diesel Oil / Steam, Coal, Diesel
    Oil, Combined Cycle / Gas Turbines / Steam, and Combined Cycle. There is no
    operator or operating-status field. The copyright attributes the layer to LUMA,
    PREPA, and FEMA, and the collection record dates the capacity check to May 2022,
    so the layer is not evidence of current operation. These are facilities, not
    service areas. Cadence is a collection assumption and licence terms require
