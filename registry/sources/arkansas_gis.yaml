    authority: state_regulator
    boundary_representation: unknown
    name_field: name
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: objectid
    attribute_fields:
      compiled_from: source
    state_fixed: AR
  notes: Reverted to draft on 2026-11-12 (decision D1). Not on the approved promotion
    list. An earlier gate left it draft as a compilation whose publisher does not
    establish each utility's authority. The declaration is retained so it can be
    opted in. Thirty-one electric utility territory polygons naming 30 utilities.
    source is blank on one. The publisher describes these as generalized areas; they
    are not legal descriptions. Cadence is a collection assumption and licence terms
    require review before redistribution.
  redistribution: internal_only
