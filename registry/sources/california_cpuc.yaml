- source_id: california_voice_territories_cpuc_2023
  publisher: California Public Utilities Commission
  driver: arcgis
  url: https://services2.arcgis.com/VofPZYDe2pLxSP5G/ArcGIS/rest/services/Utility_Territory/FeatureServer/3
  cadence: irregular
  licence: unknown
  out_of_scope: true
  superseded_by: null
  reviewed: true
  paths:
  - gis/california_voice_territories_cpuc_2023
  layers:
  - layer: '3'
    sector: telecommunications
    grain: service_area
    role: review_required
    metadata_path: gis/california_voice_territories_cpuc_2023/layer_metadata.json
    name_field: voice_company
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: OBJECTID_1
    attribute_fields:
      rate_regulation: REGTYPE
    authority: state_regulator
    state_fixed: CA
  notes: Thirty-five voice territories and 18 voice_company values. REGTYPE is PC on
    21 features and ROR on 14. Those rate categories are not mapped to a franchise
    role. STATE is CA on 23, AZ on 4, OR on 4, and NV on 4, so it is not used as the
    service state. The layer is telecommunications and is outside utility retail
    scope. Cadence is a collection assumption and licence terms require review before
    redistribution.
  redistribution: internal_only
