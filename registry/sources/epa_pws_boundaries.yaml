      on_null: reject
    name_field: PWS_Name
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: fid
      pwsid: PWSID
    on_invalid_pwsid: preserve_raw_without_federal_id
    state_from_geometry: true
    boundary_representation: mixed
    notes: CWS GeoPackage layer; 25,409 system-sourced and 19,247 modeled features.
      Apply authority per feature. Residential-type service areas are candidates only;
      match active SDWIS systems before serving. Explicit wholesale areas are non-retail,
      and ambiguous categories go to review.
    archive_member: 3_0/Service_Areas_V_3_0.gpkg
    role_field:
      field: Service_Area_Type
      values:
        ? ''
        : review_required
        '#N/A': review_required
        Dispenser: review_required
        Homeowners Association: active_retail_service
        Hotel/Motel: review_required
        Industrial/Agricultural: review_required
        Institution: review_required
        Interstate Carrier: review_required
        Medical Facility: review_required
        Mobile Home Park: active_retail_service
        Mobile Home Park - Principal Residence: active_retail_service
