        Summer Camp: review_required
        Wholesaler of Water: regional_wholesale_or_district
      on_null: review_required
    attribute_fields:
      raw_area_type: Service_Area_Type
  - layer: T_NTNC
    sector: water
    grain: service_area
    name_field: PWS_Name
    on_missing_name: preserve_and_review
    id_fields:
      feature_id: fid
      pwsid: PWSID
    on_invalid_pwsid: preserve_raw_without_federal_id
    state_from_geometry: true
    boundary_representation: mixed
    notes: 'Location confidence distinguishes 75,392 EPA-estimated polygons from 2,077
      state-sourced polygons. Replacement of the older v1.1 layer requires review.
      Apply the approved PWSID exception policy; see registry/pwsid_format_audit.json.
      Role is held for review: the source includes wholesale and other non-retail
      systems. On-site candidates require active unique system identity and independently
      verified footprint before serving. Conflicts, missing fields, mixed wholesaling
      and ambiguous types route to review.'
    authority:
      field: LOCATION_CONFIDENCE
      values:
        HIGHER: federal_modeled
        LOWER: federal_modeled
        State Sourced: federal_submitted
      on_null: reject
    archive_member: 3_0/Service_Areas_V_3_0.gpkg
