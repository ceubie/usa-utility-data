  notes: Collected EPA v3 archive; retain both layers while the review of replacing
    the older non-community source remains pending. Exact IDs follow the approved
    registry policy. Licence terms require confirmation before redistribution. Explicit
    area-type and multi-field role rules preserve wholesale, on-site candidates and
    review cases separately; no on-site area is served without footprint verification.
    Both layers require a reviewed per-feature wholesale, non-community and status
    strategy before they can supply serving areas.
