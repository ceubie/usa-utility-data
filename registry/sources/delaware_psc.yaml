    sector: water
    grain: service_area
    metadata_path: gis/delaware_water_certificated_areas_psc/layer_metadata.json
    name_field: COMPANY1
    id_fields:
      feature_id: OBJECTID
      state_id: CPCN_
    authority: state_regulator
    vintage_field: ISSUE_DATE
    state_fixed: DE
    on_missing_name: preserve_and_review
    attribute_fields:
      certificate_description: SERVICE_A
  notes: 'Licence review on 2026-11-12 found the re-fetched text is not a redistribution grant. Cadence is a conservative collection assumption; licence terms require verification
    before redistribution. Certificate issue dates do not necessarily establish polygon
