table: system_county_coverage
path: system_county_coverage.parquet
primary_key: [system_id, county_geoid]
columns:
  - {name: system_id, type: string, nullable: false, description: Active water system.}
  - {name: county_geoid, type: string, nullable: false, description: County GEOID. Connecticut values are planning regions.}
  - {name: state, type: string, nullable: false, description: State FIPS code of the county.}
  - {name: sector, type: string, nullable: false, vocab: sector, description: Sector of the system.}
  - {name: pop_in_area, type: integer, nullable: false, description: 2020 population of blocks in the county whose internal point is in the best serving area.}
  - {name: housing_in_area, type: integer, nullable: false, description: 2020 housing units of those blocks.}
  - {name: pop_share_of_county, type: float, nullable: true, description: pop_in_area divided by the county block population. Null when the county population is 0.}
  - {name: pop_share_of_system, type: float, nullable: true, description: pop_in_area divided by the system block population. Null when that population is 0.}
  - {name: area_share, type: float, nullable: true, description: Land area of assigned blocks divided by the county block land area.}
  - {name: evidence, type: string, nullable: false, description: "polygon, tabular, or both."}
  - {name: authority, type: string, nullable: true, vocab: authority, description: Authority of the best serving area. Null when the row is tabular only.}
  - {name: is_served, type: boolean, nullable: false, description: True when pop_share_of_county is at least 0.01 or pop_in_area is at least 100.}
  - {name: licence, type: string, nullable: false, vocab: licence, description: "Licence of the boundary, or the SDWA licence for a tabular-only row."}
  - {name: source_id, type: string, nullable: false, description: "Boundary source, or the SDWA source for a tabular-only row."}
  - {name: in_federal_registry, type: boolean, nullable: false, description: True when the system is in the SDWA registry.}
